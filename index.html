    <section class="section section--bg" id="book" aria-labelledby="book-title">

        <h2 id="book-title" data-i18n="contact.title"></h2>
        <p class="contact-intro" data-i18n="contact.intro"></p>

        <div class="book-card">
          <form class="booking" id="booking-form" action="https://formspree.io/f/mjgeappr" method="POST" novalidate data-i18n-attr="aria-label:contact.formLabel">
            <div class="progress">
              <p class="progress__text" aria-live="polite">
                <span data-progress-count></span>
                <span class="progress__name" data-progress-name></span>
              </p>
              <div class="progress__bar" aria-hidden="true"><span class="progress__fill" data-progress-fill></span></div>
            </div>

            <!-- Champs cachés envoyés à Formspree -->
            <input type="hidden" name="_subject" value="">
            <input type="hidden" name="lang" value="">
            <input type="hidden" name="summary" value="">
            <input type="hidden" name="estimated_price" value="">
            <div class="hp" aria-hidden="true">
              <input type="text" name="_gotcha" tabindex="-1" autocomplete="off">
            </div>

            <!-- Étape 1 : votre ménage -->

              <h3 class="step__title" tabindex="-1" data-i18n="form.step1.title"></h3>
              <p class="step__note" data-i18n="form.step1.note"></p>

                  <label class="pill"><input type="radio" name="preferred_contact" value="Text message"><span data-i18n="form.step4.confirms.1"></span></label>
                  <label class="pill"><input type="radio" name="preferred_contact" value="Phone call"><span data-i18n="form.step4.confirms.2"></span></label>
                  <label class="pill"><input type="radio" name="preferred_contact" value="Email"><span data-i18n="form.step4.confirms.3"></span></label>
                </div>
              </fieldset>

              <div class="field">
                <label class="label-field" for="heard_about_us" data-i18n="form.step4.source"></label>
                <div class="select">
                  <select id="heard_about_us" name="heard_about_us">
                    <option value="" data-i18n="form.choose"></option>
                    <option value="Google" data-i18n="form.step4.sources.0"></option>
                    <option value="Instagram" data-i18n="form.step4.sources.1"></option>
                    <option value="Facebook" data-i18n="form.step4.sources.2"></option>
                    <option value="Poster in my building" data-i18n="form.step4.sources.3"></option>
                    <option value="A friend or a referral" data-i18n="form.step4.sources.4"></option>
                    <option value="Other" data-i18n="form.step4.sources.5"></option>
                  </select>
                </div>
              </div>

              <div class="summary">
                <h4 class="summary__title" data-i18n="form.summary.title"></h4>
                <dl class="summary__list" data-summary-list></dl>
              </div>
            </div>

            <!-- Estimation : mise à jour à chaque choix. Le « ? » ouvre le détail ligne par ligne, sous le prix. -->
            <div class="estimate" data-estimate hidden>
              <div class="estimate__row" aria-live="polite">
                <p class="estimate__head">
                  <span class="estimate__label" data-estimate-label></span>
                  <button type="button" class="estimate__help" aria-expanded="false" aria-controls="estimate-detail" data-estimate-help data-i18n-attr="aria-label:form.estimate.detailLabel"><span aria-hidden="true">?</span></button>
                </p>
                <strong class="estimate__value" data-estimate-value></strong>
              </div>
              <p class="estimate__tax" data-estimate-tax hidden></p>
              <div class="estimate__detail" id="estimate-detail" data-estimate-detail hidden>
                <ul class="estimate__breakdown" data-estimate-breakdown></ul>
                <p class="estimate__fine" data-estimate-fine></p>
              </div>
              <p class="estimate__then" data-estimate-then hidden></p>
              <p class="estimate__quote" data-estimate-quote hidden></p>
              <p class="estimate__note" data-estimate-note></p>
            </div>

            <div class="form-nav">
              <button type="button" class="btn btn-secondary" data-back data-i18n="form.back"></button>
              <button type="button" class="btn btn-primary" data-next data-i18n="form.next"></button>
              <button type="submit" class="btn btn-primary" data-submit hidden data-i18n="form.submit"></button>
            </div>
            <p class="form-error" role="alert" data-send-error></p>
            <p class="form-privacy" data-i18n="form.privacy"></p>
          </form>
        </div>

        <!-- Coordonnées, après le formulaire -->
        <div class="contact-info">
          <a href="#" class="contact-item" data-icon="📞" data-phone-link><span data-phone-text></span></a>
          <a href="#" class="contact-item" data-icon="💬" target="_blank" rel="noopener" data-whatsapp-link><span data-i18n="contact.whatsapp"></span></a>
          <a href="https://maps.google.com/?q=Toronto,+ON" class="contact-item" data-icon="📍" target="_blank" rel="noopener"><span data-i18n="contact.area"></span></a>
          <a href="#" class="contact-item" data-icon="✉️" data-email-link><span data-email-text></span></a>
        </div>
      </div>
    </section>
  </main>

  <!-- PIED DE PAGE -->
  <footer class="footer">
    <img src="images/logo.png" alt="" width="94" height="80" loading="lazy" onerror="this.remove()">
    <p class="footer-name" aria-hidden="true"><span class="n-white" data-i18n="brand.word1"></span> <span class="n-orange" data-i18n="brand.word2"></span> <span class="n-blue" data-i18n="brand.word3"></span></p>
    <p data-i18n="footer.line"></p>
    <p class="footer-links">
      <a href="#" data-phone-link><span data-phone-text></span></a>
      <a href="#" target="_blank" rel="noopener" data-whatsapp-link data-i18n="contact.whatsapp"></a>
      <button type="button" class="footer-link-btn" data-open-privacy data-i18n="footer.privacy"></button>
    </p>
    <p class="insured insured--footer"><svg class="insured__icon" aria-hidden="true" focusable="false"><use href="#i-shield"/></svg><span data-i18n="trust.insured"></span></p>
    <p class="footer-legal" data-i18n="footer.legal"></p>
  </footer>

  <!-- Fenêtre de succès -->
  <dialog class="dialog" id="success-dialog" aria-labelledby="success-title" data-success-dialog>
    <p class="dialog__icon" aria-hidden="true" data-icon="✅"></p>
    <h2 class="dialog__title" id="success-title" data-i18n="form.success.title"></h2>
    <p class="dialog__text" data-i18n="form.success.text"></p>
    <button type="button" class="btn btn-primary" data-close-dialog data-i18n="form.success.close"></button>
  </dialog>

  <!-- Politique de confidentialité -->
  <dialog class="dialog dialog--privacy" id="privacy-dialog" aria-labelledby="privacy-title" data-privacy-dialog>
    <h2 class="dialog__title" id="privacy-title" data-i18n="privacy.title"></h2>
    <p class="dialog__meta" data-i18n="privacy.updated"></p>
    <div class="dialog__body" data-privacy-sections></div>
    <button type="button" class="btn btn-primary" data-close-privacy data-i18n="privacy.close"></button>
  </dialog>

  <script src="js/config.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
