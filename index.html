<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- Titre et description en anglais pour les aperçus de liens (WhatsApp, Facebook, Google).
       js/main.js les remplace selon la langue. -->
  <title>Cleanton Express Cleaning | 24/7 cleaning services in Toronto</title>
  <meta name="description" content="24/7 professional cleaning in Toronto for condos, apartments, homes and businesses. Eco-friendly products, service in English and French.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Cleanton Express Cleaning">
  <meta property="og:title" content="Cleanton Express Cleaning | 24/7 cleaning services in Toronto">
  <meta property="og:description" content="24/7 professional cleaning in Toronto for condos, apartments, homes and businesses. Eco-friendly products, service in English and French.">
  <meta property="og:locale" content="en_CA">
  <meta property="og:locale:alternate" content="fr_CA">
  <!-- og:url et og:image (images/og.jpg) : à ajouter quand le domaine sera acheté (voir docs/images.md, n° 7) -->
  <meta name="theme-color" content="#0b1628">
  <link rel="icon" type="image/png" href="images/favicon.png">
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&amp;family=DM+Sans:wght@300;400;500&amp;display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="skip-link" href="#main" data-i18n="skip"></a>

  <!-- NAVIGATION -->
  <header class="nav" id="top" data-header>
    <a class="nav-brand" href="#top" data-i18n-attr="aria-label:brand.home">
      <img class="logo" src="images/logo.png" alt="" width="94" height="80" onerror="this.remove()">
      <span class="nav-brand-name" aria-hidden="true"><span class="n-white" data-i18n="brand.word1"></span> <span class="n-orange" data-i18n="brand.word2"></span> <span class="n-blue" data-i18n="brand.word3"></span></span>
    </a>
    <nav class="nav-links" data-i18n-attr="aria-label:nav.label">
      <a href="#why" data-i18n="nav.why"></a>
      <a href="#services" data-i18n="nav.services"></a>
      <a href="#book" data-i18n="nav.contact"></a>
    </nav>
    <div class="nav-actions">
      <div class="lang-switch" role="group" data-i18n-attr="aria-label:nav.language">
        <button type="button" class="lang-switch__btn" data-set-lang="en" lang="en" data-i18n="lang.en" data-i18n-attr="aria-label:lang.enName"></button>
        <button type="button" class="lang-switch__btn" data-set-lang="fr" lang="fr" data-i18n="lang.fr" data-i18n-attr="aria-label:lang.frName"></button>
      </div>
      <a class="nav-cta" href="#book" data-i18n="nav.quote"></a>
      <button type="button" class="hamburger" aria-expanded="false" aria-controls="drawer" data-menu-toggle>
        <span></span><span></span><span></span>
      </button>
    </div>

    <!-- Menu mobile -->
    <div class="mobile-menu" id="drawer" hidden data-drawer>
      <nav data-i18n-attr="aria-label:nav.label">
        <a href="#why" data-i18n="nav.why"></a>
        <a href="#services" data-i18n="nav.services"></a>
        <a href="#book" data-i18n="nav.contact"></a>
        <a href="#book" class="mobile-cta" data-i18n="nav.quote"></a>
      </nav>
    </div>
  </header>

  <main id="main" tabindex="-1">

    <!-- HERO -->
    <section class="hero" aria-labelledby="hero-title">
      <div class="hero-slide hero-slide--1" aria-hidden="true"></div>
      <div class="hero-slide hero-slide--2" aria-hidden="true"></div>
      <div class="hero-overlay" aria-hidden="true"></div>
      <div class="hero-content">
        <p class="badge" data-i18n="hero.badge"></p>
        <h1 id="hero-title"><span data-i18n="hero.title1"></span><br><span class="accent" data-i18n="hero.title2"></span></h1>
        <p class="sub" data-i18n="hero.sub"></p>
        <div class="cta-group">
          <a href="#book" class="btn btn-primary" data-i18n="hero.cta"></a>
          <a href="#" class="btn btn-outline btn-phone" data-phone-link data-i18n-attr="aria-label:nav.call"><span data-phone-text></span></a>
        </div>
        <p class="hero-phone"><a href="#" target="_blank" rel="noopener" data-whatsapp-link data-i18n="hero.whatsapp"></a><strong data-i18n="hero.quick"></strong></p>
      </div>
    </section>

    <!-- BANDEAU DÉFILANT (décoratif, les mêmes points sont repris plus bas) -->
    <div class="ticker-wrap" aria-hidden="true">
      <div class="ticker" data-ticker></div>
    </div>

    <!-- POURQUOI NOUS -->
    <section class="section" id="why" aria-labelledby="why-title">
      <p class="label" data-i18n="why.label"></p>
      <h2 id="why-title"><span data-i18n="why.title1"></span><br><span data-i18n="why.title2"></span></h2>
      <div class="intro-text">
        <p data-i18n="why.p1"></p>
        <p data-i18n="why.p2"></p>
      </div>
      <ul class="pillars">
        <li class="pillar"><span class="pillar-icon" aria-hidden="true" data-icon="⚡"></span><h3 data-i18n="why.pillars.0.title"></h3><p data-i18n="why.pillars.0.text"></p></li>
        <li class="pillar"><span class="pillar-icon" aria-hidden="true" data-icon="🌿"></span><h3 data-i18n="why.pillars.1.title"></h3><p data-i18n="why.pillars.1.text"></p></li>
        <li class="pillar"><span class="pillar-icon" aria-hidden="true" data-icon="🧹"></span><h3 data-i18n="why.pillars.2.title"></h3><p data-i18n="why.pillars.2.text"></p></li>
        <li class="pillar"><span class="pillar-icon" aria-hidden="true" data-icon="🤝"></span><h3 data-i18n="why.pillars.3.title"></h3><p data-i18n="why.pillars.3.text"></p></li>
        <li class="pillar"><span class="pillar-icon" aria-hidden="true" data-icon="💰"></span><h3 data-i18n="why.pillars.4.title"></h3><p data-i18n="why.pillars.4.text"></p></li>
      </ul>
    </section>

    <!-- SERVICES (fond blanc) -->
    <section class="services-outer" id="services" aria-labelledby="services-title">
      <div class="services-inner">
        <p class="label"><span data-i18n="services.label"></span> <span class="label-brand" data-i18n="services.labelBrand"></span></p>
        <h2 id="services-title" data-i18n="services.title"></h2>
        <p class="services-hint" data-i18n="services.hint"></p>

        <div class="services-grid">
          <!-- Commercial : carte à retourner -->
          <div class="flip-card" data-flip-card>
            <div class="flip-card-inner">
              <button type="button" class="flip-front flip-front--commercial" aria-controls="back-commercial">
                <span class="flip-front-overlay" aria-hidden="true"></span>
                <span class="flip-front-content">
                  <span class="flip-tag" data-i18n="services.commercial.tag"></span>
                  <span class="flip-title" data-icon="🏢"><span data-i18n="services.commercial.name"></span></span>
                  <span class="flip-hint-front" data-i18n="services.more"></span>
                </span>
              </button>
              <div class="flip-back" id="back-commercial" tabindex="-1">
                <h3 data-i18n="services.commercial.title"></h3>
                <p class="flip-back-desc" data-i18n="services.commercial.desc"></p>
                <ul class="service-list" data-i18n-list="services.commercial.items"></ul>
                <div class="flip-back-bottom">
                  <a href="#book" class="btn btn-primary btn-small" data-book-service="pro" data-i18n="services.cta"></a>
                  <button type="button" class="flip-hint-back" data-i18n="services.back"></button>
                </div>
              </div>
            </div>
          </div>

          <!-- Résidentiel : carte à retourner -->
          <div class="flip-card" data-flip-card>
            <div class="flip-card-inner">
              <button type="button" class="flip-front flip-front--residential" aria-controls="back-residential">
                <span class="flip-front-overlay" aria-hidden="true"></span>
                <span class="flip-front-content">
                  <span class="flip-tag" data-i18n="services.residential.tag"></span>
                  <span class="flip-title" data-icon="🏠"><span data-i18n="services.residential.name"></span></span>
                  <span class="flip-hint-front" data-i18n="services.more"></span>
                </span>
              </button>
              <div class="flip-back" id="back-residential" tabindex="-1">
                <h3 data-i18n="services.residential.title"></h3>
                <p class="flip-back-desc" data-i18n="services.residential.desc"></p>
                <ul class="service-list" data-i18n-list="services.residential.items"></ul>
                <div class="flip-back-bottom">
                  <a href="#book" class="btn btn-primary btn-small" data-i18n="services.cta"></a>
                  <button type="button" class="flip-hint-back" data-i18n="services.back"></button>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Zones desservies -->
        <div class="areas">
          <p class="label" data-icon="📍"><span data-i18n="areas.label"></span></p>
          <p class="areas-list" data-areas></p>
        </div>
      </div>
    </section>

    <!-- CONTACT ET RÉSERVATION -->
    <section class="section" id="book" aria-labelledby="book-title">
      <p class="label" data-i18n="contact.label"></p>
      <h2 id="book-title" data-i18n="contact.title"></h2>
      <div class="contact-grid">
        <div class="contact-info">
          <p data-i18n="contact.intro"></p>
          <a href="#" class="contact-item" data-icon="📞" data-phone-link><span data-phone-text></span></a>
          <a href="#" class="contact-item" data-icon="💬" target="_blank" rel="noopener" data-whatsapp-link><span data-i18n="contact.whatsapp"></span></a>
          <a href="https://maps.google.com/?q=Toronto,+ON" class="contact-item" data-icon="📍" target="_blank" rel="noopener"><span data-i18n="contact.area"></span></a>
        </div>

        <div class="book-card">
          <form class="booking" id="booking-form" action="https://formspree.io/f/mjgeappr" method="POST" novalidate data-i18n-attr="aria-label:contact.formLabel">
            <div class="progress">
              <p class="progress__text" aria-live="polite">
                <span data-progress-count></span>
                <span class="progress__name" data-progress-name></span>
              </p>
              <div class="progress__bar" aria-hidden="true"><span class="progress__fill" data-progress-fill></span></div>
            </div>

            <!-- Champs cachés envoyés à Formspree -->
            <input type="hidden" name="_subject" value="">
            <input type="hidden" name="lang" value="">
            <input type="hidden" name="summary" value="">
            <input type="hidden" name="grid_price" value="">
            <div class="hp" aria-hidden="true">
              <input type="text" name="_gotcha" tabindex="-1" autocomplete="off">
            </div>

            <!-- Étape 1 : votre ménage -->
            <div class="step" data-step="1">
              <h3 class="step__title" tabindex="-1" data-i18n="form.step1.title"></h3>
              <p class="step__note" data-i18n="form.step1.note"></p>

              <fieldset class="field" data-field="service">
                <legend class="label-field" data-i18n="form.step1.service"></legend>
                <div class="options options--cards">
                  <label class="option-card">
                    <input class="option-card__input" type="radio" name="service" value="Regular" data-service="regular">
                    <span class="option-card__body">
                      <span class="option-card__name" data-i18n="form.step1.services.regular.name"></span>
                      <span class="option-card__desc" data-i18n="form.step1.services.regular.desc"></span>
                      <span class="option-card__price" data-from-price="regular"></span>
                    </span>
                  </label>
                  <label class="option-card">
                    <input class="option-card__input" type="radio" name="service" value="Deep" data-service="deep">
                    <span class="option-card__body">
                      <span class="option-card__name" data-i18n="form.step1.services.deep.name"></span>
                      <span class="option-card__desc" data-i18n="form.step1.services.deep.desc"></span>
                      <span class="option-card__price" data-from-price="deep"></span>
                    </span>
                  </label>
                  <label class="option-card">
                    <input class="option-card__input" type="radio" name="service" value="Move-in/out" data-service="move">
                    <span class="option-card__body">
                      <span class="option-card__name" data-i18n="form.step1.services.move.name"></span>
                      <span class="option-card__desc" data-i18n="form.step1.services.move.desc"></span>
                      <span class="option-card__price" data-from-price="move"></span>
                    </span>
                  </label>
                  <label class="option-card">
                    <input class="option-card__input" type="radio" name="service" value="Property manager / realtor / office" data-service="pro">
                    <span class="option-card__body">
                      <span class="option-card__name" data-i18n="form.step1.services.pro.name"></span>
                      <span class="option-card__desc" data-i18n="form.step1.services.pro.desc"></span>
                      <span class="option-card__price option-card__price--quote" data-i18n="form.step1.services.pro.price"></span>
                    </span>
                  </label>
                </div>
                <p class="field__error" id="err-service" data-error></p>
              </fieldset>

              <div class="cond" data-when="residential" hidden>
                <div class="field" data-field="home_size">
                  <label class="label-field" for="home_size" data-i18n="form.step1.size"></label>
                  <div class="select">
                    <select id="home_size" name="home_size" data-size-select></select>
                  </div>
                  <p class="field__error" id="err-home_size" data-error></p>
                </div>

                <fieldset class="field">
                  <legend class="label-field" data-i18n="form.step1.type"></legend>
                  <div class="options">
                    <label class="pill"><input type="radio" name="property_type" value="Condo or apartment" checked><span data-i18n="form.step1.types.0"></span></label>
                    <label class="pill"><input type="radio" name="property_type" value="Townhouse"><span data-i18n="form.step1.types.1"></span></label>
                    <label class="pill"><input type="radio" name="property_type" value="House"><span data-i18n="form.step1.types.2"></span></label>
                  </div>
                </fieldset>
              </div>

              <div class="cond" data-when="regular" hidden>
                <fieldset class="field">
                  <legend class="label-field" data-i18n="form.step1.frequency"></legend>
                  <div class="options">
                    <label class="pill"><input type="radio" name="frequency" value="One time" data-freq="once" checked><span data-freq-label="once"></span></label>
                    <label class="pill"><input type="radio" name="frequency" value="Weekly" data-freq="weekly"><span data-freq-label="weekly"></span></label>
                    <label class="pill"><input type="radio" name="frequency" value="Bi-weekly" data-freq="biweekly"><span data-freq-label="biweekly"></span></label>
                    <label class="pill"><input type="radio" name="frequency" value="Monthly" data-freq="monthly"><span data-freq-label="monthly"></span></label>
                  </div>
                  <p class="field__note" data-i18n="form.step1.frequencyNote"></p>
                </fieldset>
              </div>

              <div class="cond" data-when="pro" hidden>
                <fieldset class="field" data-field="pro_type">
                  <legend class="label-field" data-i18n="form.step1.proType"></legend>
                  <div class="options">
                    <label class="pill"><input type="radio" name="pro_type" value="Property manager"><span data-i18n="form.step1.proTypes.0"></span></label>
                    <label class="pill"><input type="radio" name="pro_type" value="Realtor"><span data-i18n="form.step1.proTypes.1"></span></label>
                    <label class="pill"><input type="radio" name="pro_type" value="Office or shop"><span data-i18n="form.step1.proTypes.2"></span></label>
                    <label class="pill"><input type="radio" name="pro_type" value="Other"><span data-i18n="form.step1.proTypes.3"></span></label>
                  </div>
                  <p class="field__error" id="err-pro_type" data-error></p>
                </fieldset>
                <div class="field">
                  <label class="label-field" for="units_or_size" data-i18n="form.step1.units"></label>
                  <input class="input" type="text" id="units_or_size" name="units_or_size" data-i18n-attr="placeholder:form.step1.unitsExample">
                </div>
              </div>
            </div>

            <!-- Étape 2 : options (sautée pour les pros) -->
            <div class="step" data-step="2" hidden>
              <h3 class="step__title" tabindex="-1" data-i18n="form.step2.title"></h3>
              <p class="step__note" data-i18n="form.step2.note"></p>
              <div class="cond" data-when="residential" hidden>
                <fieldset class="field">
                  <legend class="visually-hidden" data-i18n="form.step2.title"></legend>
                  <ul class="checks">
                    <li><label class="check"><input type="checkbox" name="addons" value="Inside the oven" data-addon="oven"><span class="check__box" aria-hidden="true"></span><span class="check__label" data-i18n="form.step2.addons.oven"></span><span class="check__leader" aria-hidden="true"></span><span class="check__price" data-addon-price="oven"></span></label></li>
                    <li><label class="check"><input type="checkbox" name="addons" value="Inside the fridge" data-addon="fridge"><span class="check__box" aria-hidden="true"></span><span class="check__label" data-i18n="form.step2.addons.fridge"></span><span class="check__leader" aria-hidden="true"></span><span class="check__price" data-addon-price="fridge"></span></label></li>
                    <li><label class="check"><input type="checkbox" name="addons" value="Inside cabinets" data-addon="cabinets"><span class="check__box" aria-hidden="true"></span><span class="check__label" data-i18n="form.step2.addons.cabinets"></span><span class="check__leader" aria-hidden="true"></span><span class="check__price" data-addon-price="cabinets"></span></label></li>
                    <li><label class="check"><input type="checkbox" name="addons" value="Interior windows and tracks" data-addon="windows"><span class="check__box" aria-hidden="true"></span><span class="check__label" data-i18n="form.step2.windows"></span><span class="check__leader" aria-hidden="true"></span><span class="check__price" data-addon-price="windows"></span></label></li>
                    <li><label class="check"><input type="checkbox" name="addons" value="Pet hair" data-addon="pets"><span class="check__box" aria-hidden="true"></span><span class="check__label" data-i18n="form.step2.addons.pets"></span><span class="check__leader" aria-hidden="true"></span><span class="check__price" data-addon-price="pets"></span></label></li>
                  </ul>
                </fieldset>
                <label class="check check--plain"><input type="checkbox" name="fragrance_free" value="Yes"><span class="check__box" aria-hidden="true"></span><span class="check__label" data-i18n="form.step2.fragrance"></span></label>
              </div>
            </div>

            <!-- Étape 3 : où, quand et accès -->
            <div class="step" data-step="3" hidden>
              <h3 class="step__title" tabindex="-1" data-i18n="form.step3.title"></h3>
              <div class="grid-fields">
                <div class="field field--full" data-field="address">
                  <label class="label-field" for="address" data-i18n="form.step3.address"></label>
                  <input class="input" type="text" id="address" name="address" autocomplete="street-address">
                  <p class="field__error" id="err-address" data-error></p>
                </div>
                <div class="field" data-field="unit">
                  <label class="label-field" for="unit" data-i18n="form.step3.unit"></label>
                  <input class="input" type="text" id="unit" name="unit" autocomplete="address-line2">
                </div>
                <div class="field" data-field="postal_code">
                  <label class="label-field" for="postal_code" data-i18n="form.step3.postal"></label>
                  <input class="input" type="text" id="postal_code" name="postal_code" autocomplete="postal-code" autocapitalize="characters" maxlength="10" spellcheck="false">
                  <p class="field__error" id="err-postal_code" data-error></p>
                </div>
                <div class="field" data-field="city">
                  <label class="label-field" for="city" data-i18n="form.step3.city"></label>
                  <input class="input" type="text" id="city" name="city" autocomplete="address-level2" value="Toronto">
                  <p class="field__error" id="err-city" data-error></p>
                </div>
                <div class="field" data-field="date">
                  <label class="label-field" for="date" data-i18n="form.step3.date"></label>
                  <input class="input" type="date" id="date" name="date">
                  <p class="field__error" id="err-date" data-error></p>
                </div>
              </div>

              <fieldset class="field" data-field="arrival_window">
                <legend class="label-field" data-i18n="form.step3.arrival"></legend>
                <div class="options">
                  <label class="pill"><input type="radio" name="arrival_window" value="Morning, 8 to 10 am"><span data-i18n="form.step3.windows.0"></span></label>
                  <label class="pill"><input type="radio" name="arrival_window" value="Midday, 11 am to 1 pm"><span data-i18n="form.step3.windows.1"></span></label>
                  <label class="pill"><input type="radio" name="arrival_window" value="Afternoon, 2 to 4 pm"><span data-i18n="form.step3.windows.2"></span></label>
                </div>
                <p class="field__note" data-i18n="form.step3.arrivalNote"></p>
                <p class="field__error" id="err-arrival_window" data-error></p>
              </fieldset>

              <fieldset class="field">
                <legend class="label-field" data-i18n="form.step3.flexibility"></legend>
                <div class="options">
                  <label class="pill"><input type="radio" name="flexibility" value="Only this date"><span data-i18n="form.step3.flexibilities.0"></span></label>
                  <label class="pill"><input type="radio" name="flexibility" value="Day before or after"><span data-i18n="form.step3.flexibilities.1"></span></label>
                  <label class="pill"><input type="radio" name="flexibility" value="Any day that week" checked><span data-i18n="form.step3.flexibilities.2"></span></label>
                </div>
              </fieldset>

              <fieldset class="field">
                <legend class="label-field" data-i18n="form.step3.access"></legend>
                <div class="options">
                  <label class="pill"><input type="radio" name="access" value="I'll be home"><span data-i18n="form.step3.accesses.0"></span></label>
                  <label class="pill"><input type="radio" name="access" value="Concierge or front desk"><span data-i18n="form.step3.accesses.1"></span></label>
                  <label class="pill"><input type="radio" name="access" value="Key in a lockbox"><span data-i18n="form.step3.accesses.2"></span></label>
                  <label class="pill"><input type="radio" name="access" value="Buzzer code"><span data-i18n="form.step3.accesses.3"></span></label>
                  <label class="pill"><input type="radio" name="access" value="Other"><span data-i18n="form.step3.accesses.4"></span></label>
                </div>
              </fieldset>

              <div class="cond" data-when="move" hidden>
                <fieldset class="field">
                  <legend class="label-field" data-i18n="form.step3.elevator"></legend>
                  <div class="options">
                    <label class="pill"><input type="radio" name="elevator_booking" value="Not sure" checked><span data-i18n="form.step3.elevators.0"></span></label>
                    <label class="pill"><input type="radio" name="elevator_booking" value="Yes, I'll book it"><span data-i18n="form.step3.elevators.1"></span></label>
                    <label class="pill"><input type="radio" name="elevator_booking" value="No"><span data-i18n="form.step3.elevators.2"></span></label>
                  </div>
                </fieldset>
              </div>

              <div class="field">
                <label class="label-field" for="message" data-i18n="form.step3.details"></label>
                <textarea class="input input--area" id="message" name="message" rows="3" data-i18n-attr="placeholder:form.step3.detailsExample"></textarea>
              </div>
            </div>

            <!-- Étape 4 : coordonnées et récapitulatif -->
            <div class="step" data-step="4" hidden>
              <h3 class="step__title" tabindex="-1" data-i18n="form.step4.title"></h3>
              <div class="grid-fields">
                <div class="field field--full" data-field="name">
                  <label class="label-field" for="name" data-i18n="form.step4.name"></label>
                  <input class="input" type="text" id="name" name="name" autocomplete="name">
                  <p class="field__error" id="err-name" data-error></p>
                </div>
                <div class="field" data-field="phone">
                  <label class="label-field" for="phone" data-i18n="form.step4.phone"></label>
                  <input class="input" type="tel" id="phone" name="phone" autocomplete="tel" inputmode="tel">
                  <p class="field__error" id="err-phone" data-error></p>
                </div>
                <div class="field" data-field="email">
                  <label class="label-field" for="email" data-i18n="form.step4.email"></label>
                  <input class="input" type="email" id="email" name="email" autocomplete="email" spellcheck="false">
                  <p class="field__error" id="err-email" data-error></p>
                </div>
              </div>

              <fieldset class="field">
                <legend class="label-field" data-i18n="form.step4.confirm"></legend>
                <div class="options">
                  <label class="pill"><input type="radio" name="preferred_contact" value="WhatsApp" checked><span data-i18n="form.step4.confirms.0"></span></label>
                  <label class="pill"><input type="radio" name="preferred_contact" value="Text message"><span data-i18n="form.step4.confirms.1"></span></label>
                  <label class="pill"><input type="radio" name="preferred_contact" value="Phone call"><span data-i18n="form.step4.confirms.2"></span></label>
                  <label class="pill"><input type="radio" name="preferred_contact" value="Email"><span data-i18n="form.step4.confirms.3"></span></label>
                </div>
              </fieldset>

              <div class="field">
                <label class="label-field" for="heard_about_us" data-i18n="form.step4.source"></label>
                <div class="select">
                  <select id="heard_about_us" name="heard_about_us">
                    <option value="" data-i18n="form.choose"></option>
                    <option value="Google" data-i18n="form.step4.sources.0"></option>
                    <option value="Instagram" data-i18n="form.step4.sources.1"></option>
                    <option value="Facebook" data-i18n="form.step4.sources.2"></option>
                    <option value="Poster in my building" data-i18n="form.step4.sources.3"></option>
                    <option value="A friend or a referral" data-i18n="form.step4.sources.4"></option>
                    <option value="Other" data-i18n="form.step4.sources.5"></option>
                  </select>
                </div>
              </div>

              <div class="summary">
                <h4 class="summary__title" data-i18n="form.summary.title"></h4>
                <dl class="summary__list" data-summary-list></dl>
                <div class="summary__price">
                  <span class="summary__price-label" data-i18n="form.summary.price"></span>
                  <strong class="summary__price-value" data-summary-price></strong>
                </div>
                <p class="summary__line" data-summary-then hidden></p>
                <p class="summary__line" data-summary-plus hidden></p>
                <p class="summary__final" data-i18n="form.summary.final"></p>
              </div>
            </div>

            <div class="form-nav">
              <button type="button" class="btn btn-secondary" data-back data-i18n="form.back"></button>
              <button type="button" class="btn btn-primary" data-next data-i18n="form.next"></button>
              <button type="submit" class="btn btn-primary" data-submit hidden data-i18n="form.submit"></button>
            </div>
            <p class="form-error" role="alert" data-send-error></p>
            <p class="form-privacy" data-i18n="form.privacy"></p>
          </form>
        </div>
      </div>
    </section>
  </main>

  <!-- PIED DE PAGE -->
  <footer class="footer">
    <img src="images/logo.png" alt="" width="94" height="80" loading="lazy" onerror="this.remove()">
    <p class="footer-name" aria-hidden="true"><span class="n-white" data-i18n="brand.word1"></span> <span class="n-orange" data-i18n="brand.word2"></span> <span class="n-blue" data-i18n="brand.word3"></span></p>
    <p data-i18n="footer.line"></p>
    <p class="footer-links">
      <a href="#" data-phone-link><span data-phone-text></span></a>
      <a href="#" target="_blank" rel="noopener" data-whatsapp-link data-i18n="contact.whatsapp"></a>
      <button type="button" class="footer-link-btn" data-open-privacy data-i18n="footer.privacy"></button>
    </p>
    <p class="footer-legal" data-i18n="footer.legal"></p>
  </footer>

  <!-- Fenêtre de succès -->
  <dialog class="dialog" id="success-dialog" aria-labelledby="success-title" data-success-dialog>
    <p class="dialog__icon" aria-hidden="true" data-icon="✅"></p>
    <h2 class="dialog__title" id="success-title" data-i18n="form.success.title"></h2>
    <p class="dialog__text" data-i18n="form.success.text"></p>
    <button type="button" class="btn btn-primary" data-close-dialog data-i18n="form.success.close"></button>
  </dialog>

  <!-- Politique de confidentialité -->
  <dialog class="dialog dialog--privacy" id="privacy-dialog" aria-labelledby="privacy-title" data-privacy-dialog>
    <h2 class="dialog__title" id="privacy-title" data-i18n="privacy.title"></h2>
    <p class="dialog__meta" data-i18n="privacy.updated"></p>
    <div class="dialog__body" data-privacy-sections></div>
    <button type="button" class="btn btn-primary" data-close-privacy data-i18n="privacy.close"></button>
  </dialog>

  <script src="js/config.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
